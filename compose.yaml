services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: laozi
      POSTGRES_PASSWORD: laozi
      POSTGRES_DB: laozi
    ports:
      - "5442:5432"
    volumes:
      - laozi-pg:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  laozi-pg:
